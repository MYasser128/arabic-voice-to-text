<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التعرف على الصوت العربي</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div class="card">
      <h1>التعرف على الصوت العربي</h1>

      <label for="transcript" class="field-label">النص</label>
      <textarea
        id="transcript"
        class="transcript"
        rows="6"
        placeholder="اضغط على الميكروفون وتحدث، أو اكتب مباشرة..."
      ></textarea>

      <section class="mic-section">
        <div class="speak-circles-waves" id="speakWaves" aria-hidden="true" hidden>
          <span class="circle-wave wave1"></span>
          <span class="circle-wave wave2"></span>
          <span class="circle-wave wave3"></span>
        </div>
        <button
          type="button"
          class="mic-btn"
          id="micBtn"
          aria-label="بدء الاستماع"
          title="بدء الاستماع"
        >
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" x2="12" y1="19" y2="22"/>
          </svg>
        </button>
        <p class="mic-status" id="micStatus" aria-live="polite"></p>
      </section>

      <div class="actions">
        <button type="button" class="btn btn-secondary" id="clearBtn">مسح</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
